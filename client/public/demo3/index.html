<!DOCTYPE html>
<html>
    <head>
        <title>Audio Visualizer - Zig/Wasm</title>
        <style>
            body { 
                background: #111; 
                color: #eee;
                display: flex; 
                flex-direction: column;
                justify-content: center; 
                align-items: center; 
                height: 100vh; 
                margin: 0; 
                font-family: sans-serif;
            }
            .controls {
                margin-bottom: 20px;
                display: flex;
                gap: 10px;
                align-items: center;
            }
            canvas { 
                background: black; 
                border: 2px solid #333; 
                width: 800px; 
                height: 600px; 
            }
            button {
                padding: 10px 20px;
                cursor: pointer;
                background: #007bff;
                color: white;
                border: none;
                border-radius: 4px;
            }
            button:hover { background: #0056b3; }
        </style>
    </head>
    <body>
        <div class="controls">
            <input type="file" id="input" accept="audio/*">
            <button id="playBtn">Play / Stop</button>
        </div>
        <canvas id="canvas" width="800" height="600"></canvas>
        <script src="./index.js"></script>
    </body>
</html>
