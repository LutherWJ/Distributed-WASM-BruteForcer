<!doctype html>
<html>
    <head>
        <title>WASM Demo 2</title>
    </head>
    <body>
        <input type="text" placeholder="Enter your name" id="name-box"/>
        <button id="connect-btn">Connect</button>
        <div id="err-box"></div>
        <div>Connection status: <div id="status">not connected</div></div>
        <div>Hashes checked by this machine: <div id="my-hashes">0</div></div>
        <div>Hashes checked Total: <div id="total-hashes">0</div></div>
        <div>My hashes per second <div id="my-hps"></div></div>
        <div>Total hashes per second: <div id="total-hps"></div></div>
        
        <div id="progress-container">
            <h3>Overall Search Progress</h3>
            <div id="progress-bar-bg">
                <div id="progress-bar-fill"></div>
            </div>
            <div id="progress-text">0 / 0 batches (0%)</div>
        </div>

        <div id="leaderboard-container">
            <h3>Leaderboard</h3>
            <table id="leaderboard">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>HPS</th>
                        <th>Total Hashes</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>

        <div id="solution-overlay" class="hidden">
            <div id="solution-modal">
                <h1>Password Found</h1>
                <div id="solution-details">
                    <p>Password: <span id="found-password" class="highlight"></span></p>
                    <p>Found by: <span id="winner-name" class="highlight"></span></p>
                </div>
                <button id="close-overlay">Dismiss</button>
            </div>
        </div>
    </body>
    <script src="index.js"></script>
    <style>
        #err-box {
            color: red;
        }
        #leaderboard-container {
            margin-top: 20px;
            border-top: 1px solid #ccc;
            padding-top: 10px;
        }
        #progress-container {
            margin-top: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        #progress-bar-bg {
            width: 100%;
            height: 20px;
            background-color: #eee;
            border-radius: 10px;
            overflow: hidden;
        }
        #progress-bar-fill {
            width: 0%;
            height: 100%;
            background-color: #4caf50;
            transition: width 0.3s ease-in-out;
        }
        #progress-text {
            margin-top: 5px;
            font-size: 0.9em;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .hidden {
            display: none !important;
        }
        #solution-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #solution-modal {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 80%;
        }
        .highlight {
            font-weight: bold;
            color: #4caf50;
            font-size: 1.2em;
        }
        #solution-details {
            margin: 20px 0;
            font-size: 1.1em;
        }
        #close-overlay {
            margin-top: 20px;
            padding: 10px 25px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</html>
