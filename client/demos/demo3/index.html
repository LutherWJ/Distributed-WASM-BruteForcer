<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wasm Audio Visualizer</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background-color: #121212;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      #container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 20px;
        border: 1px solid #333;
        border-radius: 8px;
        background-color: #1e1e1e;
      }
      h1 {
        margin: 0 0 10px 0;
      }
      canvas {
        background-color: #000;
        border: 1px solid #444;
        border-radius: 4px;
      }
      #controls {
        display: flex;
        gap: 15px;
        align-items: center;
      }
      button,
      input[type="file"]::file-selector-button {
        padding: 10px 15px;
        border: none;
        border-radius: 5px;
        background-color: #3f51b5;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      button:hover,
      input[type="file"]::file-selector-button:hover {
        background-color: #303f9f;
      }
      label {
        font-size: 14px;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <h1>Audio Visualizer</h1>
      <canvas id="visualizer-canvas" width="800" height="600"></canvas>
      <div id="controls">
        <input type="file" id="audio-upload" accept="audio/*" />
        <button id="play-btn">Play</button>
        <button id="mic-btn">Start Mic</button>
      </div>
      <div id="fps-display" style="font-family: monospace; color: #0f0; margin-top: 5px;">FPS: --</div>
      <label>Using a sample file? Click Play!</label>
    </div>
    <script src="./index.js" type="module"></script>
  </body>
</html>
